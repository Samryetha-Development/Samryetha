[project]
name = "samryetha-backend"
version = "0.1.0"
description = "Samryetha campus forum API — Python (FastAPI) parity port of the TypeScript backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "argon2-cffi>=23.1",
    "apscheduler<4",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/samryetha"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 只查真实 bug（语法错误 E9 / 使用前赋值 F63 / 非法操作 F7 / 未定义名 F82），
# 不因存量代码的未使用导入(F401)/未使用变量(F841)/导入顺序(E402)等风格问题阻断 CI
# Only real bugs (syntax E9 / use-before-assignment F63 / invalid-ops F7 / undefined-name F82);
# don't block CI on pre-existing style (unused imports F401 / unused vars F841 / import order E402)
line-length = 120
target-version = "py312"
extend-exclude = ["tests"]
select = ["E9", "F63", "F7", "F82"]
