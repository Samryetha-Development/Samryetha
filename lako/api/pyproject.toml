[project]
name = "lako-auth-api"
version = "0.1.0"
description = "Self-hosted OIDC identity provider"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "cryptography>=44",
  "fastapi>=0.115",
  "email-validator>=2.2",
  "pydantic-settings>=2.7",
  "PyJWT[crypto]>=2.10",
  "pyotp>=2.9",
  "python-multipart>=0.0.18",
  "segno>=1.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008"]
