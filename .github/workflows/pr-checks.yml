name: PR checks

# 当收到/更新 PR，以及向 dev/main 推送时，对全量代码跑检查
# Run full-code checks when a PR is opened/updated, and on push to dev/main
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Explicit dispatch lets bot-created version PRs run checks without PR-event approval.
  workflow_dispatch:

# 只需默认的 contents:read；检查结果以 check run 形式自动回显到 PR，无需额外权限
# Default contents:read is enough; check results surface on the PR as check runs automatically
permissions:
  contents: read

jobs:
  finalize-version:
    name: Finalize version PR
    needs: [backend, frontend, automation]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'codex/version-bump-pr-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: patch-version-merge-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      # This write-capable job executes only trusted main code, never the PR's script.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify this attempt's completed checks and merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
          VERSION_CHECK_RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/patch-version.mjs merge

  automation:
    name: Automation scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/dev-to-main-sync.test.mjs
      - run: node --test .github/scripts/patch-version.test.mjs

  backend:
    # Python(FastAPI) 后端：编译 + lint + 测试
    # Python (FastAPI) backend: compile + lint + test
    name: Backend (compile + lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile check (compileall)
        run: uv run python -m compileall -q src

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check backend (basedpyright strict)
        run: uv run basedpyright

      - name: Check generated OpenAPI
        run: uv run python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    # React/TS 前端：类型检查 + 构建
    # React/TS frontend: type check + build
    name: Frontend (typecheck + build + artifact integrity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean locked dependency install (isolated store)
        run: pnpm install --frozen-lockfile --store-dir "${{ runner.temp }}/samryetha-pnpm-store"

      - name: Artifact integrity regression tests
        run: pnpm test:artifacts

      - name: Check generated API types
        run: pnpm check:api

      - name: Type check (tsc --noEmit)
        run: pnpm typecheck

      - name: Build (vite)
        run: pnpm build

      - name: Verify deployable artifacts
        run: pnpm check:artifacts

      - name: Beta recovery and inbox privacy smoke
        run: pnpm test:beta

      - name: Auth redirect smoke
        run: node scripts/auth-redirect-smoke.mjs

      - name: Office preview smoke
        run: node scripts/document-preview-smoke.cjs

      - name: File pages StrictMode smoke
        run: node scripts/files-strictmode-smoke.cjs

      - name: Polls StrictMode smoke
        run: node scripts/polls-smoke.cjs

      # OIDC 授权响应收窄（合法响应放行、畸形响应拒绝）
      # OIDC authorize response narrowing (valid narrowed, malformed rejected)
      - name: OIDC response smoke
        run: node scripts/oidc-response-smoke.mjs

      # 写操作失败反馈（每个用例都带负对照，避免出现永远为真的假绿用例）
      # Write-failure feedback (every case carries a negative control against vacuous passes)
      - name: Write-failure feedback smoke
        run: node scripts/write-failure-smoke.cjs

      # 拖拽上传（含本地校验、失败可见与非管理员提示，同样带负对照）
      # Drag-and-drop uploads (local validation, visible failures and the non-admin notice, also
      # carrying negative controls)
      - name: File drag-and-drop smoke
        run: node scripts/file-dragdrop-smoke.cjs

      # 文件夹导航（树/面包屑、新建落点、删除后果与失败可见，同样带负对照）
      # Folder navigation (tree and breadcrumb, create target, delete consequences and visible
      # failures, also carrying negative controls)
      - name: File folders smoke
        run: node scripts/file-folders-smoke.cjs

      # 元数据编辑（预填、保存载荷、清空语义与失败可见，同样带负对照）
      # Metadata editing (prefill, save payload, clear semantics and visible failures, also carrying
      # negative controls)
      - name: File metadata smoke
        run: node scripts/file-metadata-smoke.cjs

      # 界面可用性（文件夹行形态与可进入/可返回、行内编辑入口与"下载/收藏/删除"并列、
      # 文件名与分区进保存载荷、保存失败可见、两段式删除，全部带负对照）
      # Interface usability (folder rows and their way in and back, the in-row edit entry point
      # beside download/save/delete, the file name and section reaching the payload, visible save
      # failures and the two-step delete, all with negative controls)
      - name: File UI usability smoke
        run: node scripts/file-ui-usability-smoke.cjs

      - name: Scheduled posts smoke
        run: node scripts/scheduled-posts-smoke.cjs

      - name: Post pagination smoke
        run: node scripts/post-pagination-smoke.cjs
