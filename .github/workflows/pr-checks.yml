name: PR checks

# 当收到/更新 PR，以及向 dev/main 推送时，对全量代码跑检查
# Run full-code checks when a PR is opened/updated, and on push to dev/main
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 只需默认的 contents:read；检查结果以 check run 形式自动回显到 PR，无需额外权限
# Default contents:read is enough; check results surface on the PR as check runs automatically
permissions:
  contents: read

jobs:
  backend:
    # Python(FastAPI) 后端：编译 + lint + 测试
    # Python (FastAPI) backend: compile + lint + test
    name: Backend (compile + lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Compile check (compileall)
        run: uv run python -m compileall -q src

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    # React/TS 前端：类型检查 + 构建
    # React/TS frontend: type check + build
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            packages/ui-commons/pnpm-lock.yaml
            lako/pnpm-lock.yaml

      # 两个 file: 引的共享包都必须**先于 frontend 的 install** 构建。pnpm 对 file:
      # 目录依赖做的是安装那一刻的拷贝，装进去的是那一刻的 dist；先装前端再构建，
      # 装进去的就是空产物，而且不会有任何报错，只在 typecheck 时冒出
      # "Cannot find module"。
      # Both file: deps must be built before the frontend install (hardlinked at
      # install time — see deploy.sh for the same ordering).
      #
      # @lako/ui 尤其要紧：它的 package.json 里 files 只放行 dist 与 src/auth.css，
      # 所以消费方拿到的拷贝里根本没有 src/*.tsx——exports 里那句
      # types: ./src/index.ts 在消费方永远指不到实体，类型只能落在 dist/index.d.ts 上。
      - name: Build Lako UI package
        working-directory: lako
        run: pnpm install --frozen-lockfile && pnpm --dir packages/ui build

      - name: Build shared UI package
        working-directory: packages/ui-commons
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: pnpm typecheck

      - name: Build (vite)
        run: pnpm build

      - name: SSR smoke
        run: node scripts/ssr-smoke.mjs

  i18n:
    # i18n 服务：locale 生成物校验 + seed 同步校验 + pytest
    # i18n service: locale generation check + seed sync check + pytest
    name: i18n (locale sync + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # .ts（唯一真源）→ .json 生成物必须最新。纯标准库脚本，从仓库根运行。
      # .ts (source of truth) → .json must be up to date; stdlib-only, run from repo root.
      - name: Check generated locale JSON (.ts → .json)
        run: python3 frontend/scripts/gen_locale_json.py --check

      # .json → seed/*.json 必须完全一致（key 集合 + 顺序 + 值照抄）。
      # .json → seed/*.json must match exactly (key set + order + verbatim values).
      - name: Check seed sync (frontend → seed)
        run: python3 i18n/check_sync.py

      - name: Install dependencies
        working-directory: i18n
        run: uv sync --dev

      - name: Test (pytest)
        working-directory: i18n
        run: uv run pytest
