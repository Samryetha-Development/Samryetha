<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // 首帧前应用主题，避免深浅色闪白（FOUC）。key 与取值和 lib/theme.ts 保持一致。
      // Apply theme before first paint to avoid light/dark flash; keys mirror lib/theme.ts.
      (function () {
        try {
          var choice = localStorage.getItem("samryetha.theme");
          var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="theme-color" content="#f7f8f8" />
    <meta name="description" content="Samryetha build tasks." />
    <link rel="stylesheet" href="/src/globals.css" />
    <title>Samryetha — Tasks</title>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-tasks-client.tsx"></script>
  </body>
</html>
